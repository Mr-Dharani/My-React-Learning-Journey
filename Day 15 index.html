<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM 2</title>
    <link rel="stylesheet" href="Day 15 style.css">
</head>
<body>
    <form id="registrationForm">

    <input
        id="name"
        type="text"
        placeholder="Enter your name"
    >

    <p id="nameError"></p>


    <input
        id="email"
        type="email"
        placeholder="Enter your email"
    >

    <p id="emailError"></p>


    <input
        id="password"
        type="password"
        placeholder="Enter your password"
    >

    <p id="passwordError"></p>


    <input
        id="age"
        type="number"
        placeholder="Enter your age"
    >

    <p id="ageError"></p>


    <button type="submit">
        Register
    </button>

</form>

<h2 id="successMessage"></h2>

<script src="Day 15 script.js"></script>
</body>
</html>
