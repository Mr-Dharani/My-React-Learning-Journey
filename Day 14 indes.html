<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dharani Profile</title>

    <link rel="stylesheet" href="Day 14.css">
</head>

<body>

    <div class="profile">

        <h1 id="name">Dharani T</h1>

        <h2>Future React Developer</h2>

        <p id="bio">
            I am learning JavaScript and React.
        </p>

        <button id="darkBtn">
            Dark Mode
        </button>

        <button id="bioBtn">
            Change Bio
        </button>

        <hr>

        <h2>My Skills</h2>

        <input
            id="skillInput"
            type="text"
            placeholder="Enter a skill"
        >

        <button id="addSkill">
            Add Skill
        </button>

        <button id="removeSkill">
            Remove Last Skill
        </button>

        <ul id="skillList"></ul>

        <p id="skillCount">
            Total Skills: 0
        </p>

    </div>

    <script src="Day 14 script.js"></script>

</body>
</html>
