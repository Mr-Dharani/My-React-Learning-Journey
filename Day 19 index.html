<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Skills Manager</title>

    <link rel="stylesheet" href="Day 19 Style.css">
</head>

<body>

    <div class="container">

        <h1>💻 My Skills Manager</h1>

        <input
            type="text"
            id="skillInput"
            placeholder="Enter a skill"
        >

        <button id="addSkill">
            Add Skill
        </button>

        <button id="removeSkill">
            Remove Last Skill
        </button>

        <button id="clearSkills">
            Clear All
        </button>

        <p>
            Total Skills:
            <span id="skillCount">0</span>
        </p>

        <ul id="skillList"></ul>

    </div>

    <script src="Day 19 Script.js"></script>

</body>

</html>
