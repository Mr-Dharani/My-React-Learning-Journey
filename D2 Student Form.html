<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Student Registration Form</title> 
    </head>
    <body>
        <header>
            <h1>
                Registration Form
            </h1>
        </header>
        <main>
            <form>
                <label for="name">Name</label>
                <input id="name" type="text" placeholder="Enter your Name">
                <br>
                <label for="email">Email</label>
                <input id="email" type="email" required placeholder="Enter your Email">
                <br>
                <label for="password">Password</label>
                <input id="password" type="password" required placeholder="Enter your password">
                <br>
                <label for="phone">Phone No</label>
                <input id="phone" type="tel" placeholder="Enter your Mobile Number">
                <br>
                <label for="dob">D.O.B</label>
                <input id="dob" type="date" placeholder="Date of birth">
                <br>
                <label>Gender:</label>
                <input name="gender" type="radio">Male
                <input type="radio" name="gender">Female
                <br>
                <label for="skills">SKills</label>
                <input id="skills" type="checkbox">HTML
                <input id="skills" type="checkbox">CSS
                <input id="skills" type="checkbox">python
                <input id="skills" type="checkbox">JavaScript
                <input id="skills" type="checkbox">React
                <br>

                <label for="department">Department</label>
                <select id="department">
                    <option>AI/DS</option>
                    <option>BME</option>
                    <option>CSE</option>
                    <option>ECE</option>
                    <option>Mech</option>
                </select>
                <br>
                <label for="address">Address:</label>
                <textarea rows="3" cols="40" id="address"></textarea>
                <br>
                <label for="resume"> Resume</label>
                <input id="resume" type="file">
                <br>
                <h2>Student Details</h2>
                <table border="1">
                    <thead>
                        <tr>
                            <th>S.no</th>
                            <th>Name</th>
                            <th>Department</th>
                            <th>Gender</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1.</td>
                            <td>Dharani</td>
                            <td>BME</td>
                            <td>Male</td>
                        </tr>
                        <tr>
                            <td>2.</td>
                            <td>Gwen</td>
                            <td>BME</td>
                            <td>Female</td>
                        </tr>
                        <tr>
                            <td>3.</td>
                            <td>Dharanidharan</td>
                            <td>Mech</td>
                            <td>Male</td>
                        </tr>
                        <tr>
                            <td>4.</td>
                            <td>Subhiksha</td>
                            <td>ECE</td>
                            <td>Female</td>
                        </tr>
                    </tbody>
                </table>
                <iframe
width="560"
height="315"
src="https://www.youtube.com/embed/JwcYQchE_Gs"
title="YouTube video player"
allowfullscreen>
</iframe>

            </form>
            <footer>
                © 2026 Dharani T. All Rights Reserved.
            </footer>
            
        </main>
    </body>
</html>
